# Build destination-querri for amd64 and arm64 and push it to GHCR.
#
# Runs on a tag named destination-querri-v<version>, e.g. destination-querri-v0.2.0.
# The tag's version must equal pyproject.toml's, so an image tag always names
# the code it was built from.
name: Publish destination-querri

on:
  push:
    tags:
      - "destination-querri-v*"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/querri-inc/destination-querri

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: destination-querri
    steps:
      - uses: actions/checkout@v4

      - name: Version from tag must match pyproject.toml
        id: version
        run: |
          tag_version="${GITHUB_REF_NAME#destination-querri-v}"
          pkg_version="$(python3 -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["tool"]["poetry"]["version"])')"
          meta_version="$(grep -E '^\s+dockerImageTag:' metadata.yaml | awk '{print $2}')"
          label_version="$(sed -n 's/^LABEL io.airbyte.version=//p' Dockerfile)"
          if [ "$tag_version" != "$pkg_version" ] || [ "$tag_version" != "$meta_version" ] \
              || [ "$tag_version" != "$label_version" ]; then
            echo "tag $tag_version, pyproject $pkg_version, metadata $meta_version, Dockerfile $label_version: they must match" >&2
            exit 1
          fi
          echo "version=$tag_version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Unit tests
        run: |
          pip install . pytest pytest-mock
          python -m pytest -q unit_tests

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: destination-querri
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest

      - name: Smoke test the pushed image
        run: |
          docker run --rm "$IMAGE:${{ steps.version.outputs.version }}" spec \
            | grep -q '"type":"SPEC"'
