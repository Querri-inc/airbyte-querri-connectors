# Build destination-querri for amd64 and arm64 and push it to GHCR.
#
# Runs on a tag named destination-querri-v<version>, e.g. destination-querri-v0.2.0.
# The tag's version must equal pyproject.toml's, metadata.yaml's and the
# Dockerfile label's, so an image tag always names the code it was built from.
#
# Two jobs, so the token that can push packages never shares a runner with
# third-party code: `test` installs dependencies and runs the tests with a
# read-only token; `publish` installs nothing and only builds and pushes.
# Actions are pinned by commit SHA (the tag in the comment is for humans).
name: Publish destination-querri

on:
  push:
    tags:
      - "destination-querri-v*"

permissions:
  contents: read

env:
  IMAGE: ghcr.io/querri-inc/destination-querri

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: destination-querri
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Version from tag must match pyproject.toml, metadata.yaml and the Dockerfile
        id: version
        run: |
          tag_version="${GITHUB_REF_NAME#destination-querri-v}"
          pkg_version="$(python3 -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["tool"]["poetry"]["version"])')"
          meta_version="$(grep -E '^\s+dockerImageTag:' metadata.yaml | awk '{print $2}')"
          label_version="$(sed -n 's/^LABEL io.airbyte.version=//p' Dockerfile)"
          if [ "$tag_version" != "$pkg_version" ] || [ "$tag_version" != "$meta_version" ] \
              || [ "$tag_version" != "$label_version" ]; then
            echo "tag $tag_version, pyproject $pkg_version, metadata $meta_version, Dockerfile $label_version: they must match" >&2
            exit 1
          fi
          echo "version=$tag_version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: requirements.txt must match poetry.lock
        run: |
          python -m venv /tmp/poetry
          /tmp/poetry/bin/pip install -q "poetry==2.2.1" "poetry-plugin-export==1.9.0"
          /tmp/poetry/bin/poetry export --only main --format requirements.txt --output /tmp/requirements.txt
          if ! diff <(grep -v '^#' requirements.txt) <(grep -v '^#' /tmp/requirements.txt); then
            echo "requirements.txt is stale: regenerate it from poetry.lock (command in its header)" >&2
            exit 1
          fi

      - name: Unit tests
        run: |
          pip install --require-hashes -r requirements.txt
          pip install pytest pytest-mock
          python -m pytest -q unit_tests

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0 # every tag, to tell whether this one is the newest

      - name: Tags to push
        id: tags
        env:
          VERSION: ${{ needs.test.outputs.version }}
        run: |
          newest="$(git tag --list 'destination-querri-v*' --sort=-v:refname | head -n1)"
          tags="$IMAGE:$VERSION"
          # :latest moves only for the newest version, never for a re-tagged older one.
          if [ "$newest" = "$GITHUB_REF_NAME" ]; then
            tags="$tags,$IMAGE:latest"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: destination-querri
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}

      - name: Smoke test the pushed image (runs, and not as root)
        env:
          VERSION: ${{ needs.test.outputs.version }}
        run: |
          docker run --rm "$IMAGE:$VERSION" spec | grep -q '"type":"SPEC"'
          test "$(docker run --rm --entrypoint id "$IMAGE:$VERSION" -u)" != 0
